name: Close external pull requests

# This repository takes issues from anyone and pull requests from the owner
# only. Forking cannot be disabled on a public user-owned repository, so the
# guard is here: a PR whose author is not the owner (and not a bot) is closed
# with a pointer to the issue tracker. Runs from the base branch, so the PR's
# own workflow files never execute for this decision.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  close:
    name: Close if not the owner
    if: github.event.pull_request.user.login != github.repository_owner && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comment and close
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const body = [
              `Pull requests are owner-only in this repository; it accepts issues from anyone.`,
              ``,
              `This PR is closed. Open an issue instead: https://github.com/${owner}/${repo}/issues/new/choose`,
              ``,
              `If it reports a problem with the layer, include the build, hardware and a log excerpt.`,
            ].join('\n');
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
            await github.rest.issues.lock({ owner, repo, issue_number: pr.number, lock_reason: 'spam' });
